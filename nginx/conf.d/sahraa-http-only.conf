# SAHRAA — HTTP-only config for initial deployment (before SSL)
# Use this config FIRST, then switch to sahraa.conf after obtaining SSL certs.
# To activate: rename sahraa.conf to sahraa.conf.disabled and keep this file active.

upstream sahraa_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 20M;
    limit_conn conn 50;
    limit_req zone=general burst=100 nodelay;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Static assets
    location /_next/static/ {
        proxy_pass http://sahraa_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # API
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://sahraa_app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Application
    location / {
        proxy_pass http://sahraa_app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
